services:
  app:
    build: .
    container_name: expense_tracker
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VERCEL_API_KEY: ${VERCEL_API_KEY:-}
